name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Not optional. GitHub webhooks have been throttled hard enough that a PR and its
  # merge to main both landed with no run created and no way to ask for one. This is
  # the recovery hatch. Learned in pagevault, 2026-08-06.
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to check
        required: false
        type: string

# 🔴 Supersede, don't accumulate. Pushing three times while iterating started three full
# WebKit suites and left the earlier two running to completion.
#
# `cancel-in-progress: true` here is the OPPOSITE of the deploy workflows, and both are
# correct: cancelling a test run loses nothing, while cancelling a deploy mid-flight can
# leave a half-applied migration against the only copy of the document.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      # 🔴 v6, not v4. v4 declares `using: node20`, which the runner now force-runs on
      # Node 24 and warns about; the deprecation ends with it failing rather than
      # warning. v5 was the Node 24 update and v6 added pnpm 11 support — neither
      # changes anything this uses, and the pnpm version still comes from
      # `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The whole gate, and the same command `make check` runs locally. If CI ever
      # checks something `check` does not, the local gate is a lie.
      - run: pnpm check

  # 🔴 Separate from `check`, deliberately. This job is ~3 minutes against `check`'s
  # ~50 seconds, so making every typecheck pay for it would make the fast gate slow —
  # and a slow gate is one people stop running.
  #
  # It is not optional either. Three bugs have shipped that 263 unit tests could not
  # see: a CSS specificity conflict, a toolbar that reflowed, and rows clipped to
  # zero height. All three were found by a human on an iPhone. This job is what
  # stops the next one costing that.
  #
  # 🔴 **Not on `push`.** A merge to `main` runs `check` and nothing else here. The pull
  # request already ran this suite against the same tree, so running it again on the
  # squash commit was paying twice for one answer — and this is the single most expensive
  # thing in the repo's CI.
  #
  # What that costs, stated plainly rather than discovered later: **nothing browser-tests
  # `main`'s actual tree.** The PR run tested the merge of head into base, which is the
  # same content unless another PR landed in between — a real gap, and the one this used
  # to cover. Two things stand behind it:
  #
  #   - a production deploy runs the suite itself, before anything touches the account
  #     (deploy-prod.yml)
  #   - `workflow_dispatch` still runs it, with a `ref` input — so a full run against
  #     `main` before a release is one click, and that is the moment to want one
  #
  # So "CI is green on main" now means typecheck and unit tests. If that stops being
  # enough, put this back rather than inventing something cleverer.
  browser:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # 🔴 The official Playwright image, which ships WebKit **and** its system libraries
    # already installed. What it replaces is `playwright install --with-deps webkit`,
    # which downloaded ~80MB and then ran `apt-get` against Ubuntu mirrors on a fresh VM
    # every single run — the largest and by far the most variable part of this job. It
    # was measured stalling for over ten minutes with the suite not yet started, which is
    # what prompted this.
    #
    # 🔴 The tag must match the Playwright version in the lockfile. The step below
    # asserts it rather than trusting it, because the failure mode otherwise is silent:
    # a mismatched image makes Playwright re-download the browser at run time, which is
    # slow, green, and looks exactly like this optimisation still working.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      # The version this image ships. Bump alongside the tag above.
      PLAYWRIGHT_IMAGE_VERSION: "1.62.1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      # 🔴 v6, not v4. v4 declares `using: node20`, which the runner now force-runs on
      # Node 24 and warns about; the deprecation ends with it failing rather than
      # warning. v5 was the Node 24 update and v6 added pnpm 11 support — neither
      # changes anything this uses, and the pnpm version still comes from
      # `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Assert the image ships the Playwright this repo installs
        run: |
          installed="$(node -p "require('@playwright/test/package.json').version")"
          if [ "$installed" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::Playwright ${installed} is installed but the container ships ${PLAYWRIGHT_IMAGE_VERSION}."
            echo "::error::Update both in .github/workflows/ci.yml and deploy-prod.yml:"
            echo "::error::  container: mcr.microsoft.com/playwright:v${installed}-noble"
            echo "::error::  PLAYWRIGHT_IMAGE_VERSION: \"${installed}\""
            exit 1
          fi
          echo "✓ Playwright ${installed} matches the image"

      # WebKit only. iOS mandates it, so Safari's engine is the one that has to be
      # right; testing Chromium would report on a browser knag never runs on. No install
      # step — the image already has it, which is the whole point of the container.
      - run: pnpm test:browser

      # 🔴 Also node20 on v4, and it never appeared in a deprecation warning because it
      # only runs `if: failure()` — the runner annotates the actions a job actually
      # used, so a passing run cannot see it. It would have started failing on the
      # first red build, which is the one run where losing the trace costs most.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
