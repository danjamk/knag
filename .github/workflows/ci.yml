name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Not optional. GitHub webhooks have been throttled hard enough that a PR and its
  # merge to main both landed with no run created and no way to ask for one. This is
  # the recovery hatch. Learned in pagevault, 2026-08-06.
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to check
        required: false
        type: string

# 🔴 Supersede, don't accumulate. Pushing three times while iterating started three full
# WebKit suites and left the earlier two running to completion.
#
# `cancel-in-progress: true` here is the OPPOSITE of the deploy workflows, and both are
# correct: cancelling a test run loses nothing, while cancelling a deploy mid-flight can
# leave a half-applied migration against the only copy of the document.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      # 🔴 v6, not v4. v4 declares `using: node20`, which the runner now force-runs on
      # Node 24 and warns about; the deprecation ends with it failing rather than
      # warning. v5 was the Node 24 update and v6 added pnpm 11 support — neither
      # changes anything this uses, and the pnpm version still comes from
      # `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The whole gate, and the same command `make check` runs locally. If CI ever
      # checks something `check` does not, the local gate is a lie.
      - run: pnpm check

  # 🔴 Separate from `check`, deliberately. This job is ~3 minutes against `check`'s
  # ~50 seconds, so making every typecheck pay for it would make the fast gate slow —
  # and a slow gate is one people stop running.
  #
  # It is not optional either. Three bugs have shipped that the unit suite could not
  # see: a CSS specificity conflict, a toolbar that reflowed, and rows clipped to
  # zero height. All three were found by a human on an iPhone. This job is what
  # stops the next one costing that.
  #
  # 🔴 **Not on `push`.** A merge to `main` runs `check` and nothing else here. The pull
  # request already ran this suite against the same tree, so running it again on the
  # squash commit was paying twice for one answer — and this is the single most expensive
  # thing in the repo's CI.
  #
  # What that costs, stated plainly rather than discovered later: **nothing browser-tests
  # `main`'s actual tree.** The PR run tested the merge of head into base, which is the
  # same content unless another PR landed in between — a real gap, and the one this used
  # to cover. Two things stand behind it:
  #
  #   - a production deploy runs the suite itself, before anything touches the account
  #     (deploy-prod.yml)
  #   - `workflow_dispatch` still runs it, with a `ref` input — so a full run against
  #     `main` before a release is one click, and that is the moment to want one
  #
  # So "CI is green on main" now means typecheck and unit tests. If that stops being
  # enough, put this back rather than inventing something cleverer.
  #
  # 🔴 **Sharded four ways, and skipped when only docs changed** (#202). Serial it was
  # ten minutes — twenty spec files, one `wrangler dev` each, one worker, most of it
  # deliberate waiting — and every push paid it, including a roadmap edit. Each shard
  # runs `scripts/browser-tests.sh` over a quarter of the files by sorted index; the
  # script's one-server-per-file rule (#69) is untouched, because the parallelism is
  # across VMs and never inside one (#107 is per-server). `fail-fast` is off so one red
  # shard does not cancel the evidence the other three are collecting.
  #
  # 🔴 **The required check is `browser-ok`, below, not the shards.** A required check
  # named after a matrix entry blocks every docs-only PR forever, because a skipped job
  # never reports. `browser-ok` runs `always()`, passes when the shards passed *or* were
  # skipped for a docs-only diff, and fails otherwise — so it is the one name to put in
  # the ruleset — and it is: `protect-default` has required `check` and `browser-ok`
  # since 2026-08-25.

  # Classifies the diff so the shards can be skipped for docs. Asked of the API rather
  # than `git diff`, because a PR checkout is shallow and the base SHA is not in it.
  # A manual `workflow_dispatch` run has no PR and always runs the suite.
  changes:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "manual run — the browser suite runs"
            exit 0
          fi
          files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename')"
          # `site/` is safe to skip only because site.test.ts in the unit suite is what
          # checks the landing page; nothing in browser/ touches it.
          code=false
          while IFS= read -r f; do
            case "$f" in
              docs/*|site/*|*.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "changed:"
          printf '  %s\n' $files
          echo "code=$code"

  browser:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # 🔴 The official Playwright image, which ships WebKit **and** its system libraries
    # already installed. What it replaces is `playwright install --with-deps webkit`,
    # which downloaded ~80MB and then ran `apt-get` against Ubuntu mirrors on a fresh VM
    # every single run — the largest and by far the most variable part of this job. It
    # was measured stalling for over ten minutes with the suite not yet started, which is
    # what prompted this.
    #
    # 🔴 The tag must match the Playwright version in the lockfile. The step below
    # asserts it rather than trusting it, because the failure mode otherwise is silent:
    # a mismatched image makes Playwright re-download the browser at run time, which is
    # slow, green, and looks exactly like this optimisation still working.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      # The version this image ships. Bump alongside the tag above.
      PLAYWRIGHT_IMAGE_VERSION: "1.62.1"
      # Which quarter of browser/*.spec.ts this runner takes (scripts/browser-tests.sh).
      KNAG_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      # 🔴 v6, not v4. v4 declares `using: node20`, which the runner now force-runs on
      # Node 24 and warns about; the deprecation ends with it failing rather than
      # warning. v5 was the Node 24 update and v6 added pnpm 11 support — neither
      # changes anything this uses, and the pnpm version still comes from
      # `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Assert the image ships the Playwright this repo installs
        run: |
          installed="$(node -p "require('@playwright/test/package.json').version")"
          if [ "$installed" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::Playwright ${installed} is installed but the container ships ${PLAYWRIGHT_IMAGE_VERSION}."
            echo "::error::Update both in .github/workflows/ci.yml and deploy-prod.yml:"
            echo "::error::  container: mcr.microsoft.com/playwright:v${installed}-noble"
            echo "::error::  PLAYWRIGHT_IMAGE_VERSION: \"${installed}\""
            exit 1
          fi
          echo "✓ Playwright ${installed} matches the image"

      # WebKit only. iOS mandates it, so Safari's engine is the one that has to be
      # right; testing Chromium would report on a browser knag never runs on. No install
      # step — the image already has it, which is the whole point of the container.
      - run: pnpm test:browser

      # 🔴 Also node20 on v4, and it never appeared in a deprecation warning because it
      # only runs `if: failure()` — the runner annotates the actions a job actually
      # used, so a passing run cannot see it. It would have started failing on the
      # first red build, which is the one run where losing the trace costs most.
      # 🔴 `always()`, not `failure()` — changed with the retry in #107. The runner now
      # retries a spec file once when it dies as a dev server, so the commonest occurrence
      # of the thing being investigated is a run that **passes**. Keeping the old
      # condition would have quietly stopped collecting evidence for the exact defect the
      # retry exists to make affordable, in the environment where it happens most.
      #
      # The cost is an artifact on green runs. `scripts/browser-tests.sh` only writes
      # `test-results/dead-server/` when a server actually died, and playwright keeps
      # traces on failure only — so a clean run uploads almost nothing.
      # Named per shard, or the last upload wins and three shards' evidence is lost.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-trace-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      # 🔴 Wrangler's own crash log (#107). When the dev server dies it prints an
      # empty `✘ [ERROR]` and writes the actual stack trace to a file, which CI then
      # threw away — so two failures were triaged with no account from the process that
      # died. `if-no-files-found: ignore` because a run that fails on a real assertion
      # has no wrangler log and that is not itself a problem.
      # Same reason as above: a retried run is green, and green is when the crash log
      # from the server that died is most likely to exist and least likely to be looked
      # for.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wrangler-crash-logs-${{ matrix.shard }}
          path: |
            /github/home/.config/.wrangler/logs/
            ~/.config/.wrangler/logs/
          if-no-files-found: ignore
          retention-days: 7

  # 🔴 The one name for the ruleset. Green when every shard passed, or when the shards
  # were skipped because the diff was docs-only; red on anything else, including a
  # `changes` job that failed to classify. `always()` is what lets a skipped matrix
  # still produce a verdict — a plain `needs` would skip this too, and a required check
  # that never reports blocks the PR forever.
  browser-ok:
    needs: [changes, browser]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.browser.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "browser: ${RESULT} (code changed: ${CODE:-unknown})"
          case "$RESULT" in
            success) exit 0 ;;
            skipped) [ "$CODE" = "false" ] && exit 0 || exit 1 ;;
            *) exit 1 ;;
          esac
