name: Deploy to production

# The only path to production. The prod Cloudflare token lives in this workflow's
# environment secrets and nowhere else — not in a clone, not on the laptop. That
# placement is the guarantee: a wrong-clone `make deploy` cannot reach prod because
# the machine does not hold the credential. See docs/adr/ADR-002-two-accounts-and-migrations.md.
#
# Manual on purpose. Tagging a release does not ship production — the version names
# the code, deploying is the decision to adopt it. You click Run when you mean it.

on:
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: "Skip the migration step (only if you know none are pending)"
        type: boolean
        default: false

# Never let two prod deploys overlap. Do not cancel one in flight — a half-applied
# deploy against the only copy of the document is worse than a queued one.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # 🔴 The browser suite gates production, and this is a deliberate divergence from
  # deploy-dev.yml — the one place the two files are not mirrors. See the divergence
  # table in docs/deployment.md.
  #
  # Why it exists: `pnpm check` is a typecheck and a unit suite, and there are three
  # bugs on record that 263 unit tests could not see — a CSS specificity conflict, a
  # toolbar that reflowed, and rows clipped to zero height. All three were found by a
  # human on an iPhone. Without this job, the only thing standing between those and
  # production is remembering to look at a different workflow's result first.
  #
  # Why prod and not dev: dev tracks `main` and is the rehearsal, so a bad dev deploy
  # is information and self-corrects on the next merge. A bad prod deploy is the thing
  # this whole pipeline exists to prevent, and prod is manual — you already clicked
  # Run, so you can wait four minutes.
  #
  # 🔴 No `environment:` on this job, on purpose. It needs no credential, and keeping
  # it outside `production` means it cannot read the prod token and does not consume
  # the reviewer approval. The approval is then asked *after* the tests are green,
  # which is the right order to ask a human anything.
  browser:
    runs-on: ubuntu-latest
    # The Playwright image, matching ci.yml — WebKit and its system libraries are already
    # installed, so there is no download and no apt-get in front of a production deploy.
    # Keep this tag and the assertion below in step with ci.yml's.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      PLAYWRIGHT_IMAGE_VERSION: "1.62.1"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Assert the image ships the Playwright this repo installs
        run: |
          installed="$(node -p "require('@playwright/test/package.json').version")"
          if [ "$installed" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::Playwright ${installed} is installed but the container ships ${PLAYWRIGHT_IMAGE_VERSION}."
            echo "::error::Update the container tag and PLAYWRIGHT_IMAGE_VERSION in ci.yml and deploy-prod.yml."
            exit 1
          fi
          echo "✓ Playwright ${installed} matches the image"

      # WebKit only. iOS mandates it, so Safari's engine is the one that has to be
      # right; testing Chromium would report on a browser knag never runs on. No install
      # step — the image already has it.
      - run: pnpm test:browser

      # The trace is worth most on the run that blocked a production deploy.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-trace-prod-gate
          path: test-results/
          retention-days: 7

  deploy:
    # Nothing touches the prod account until the browser suite is green.
    needs: browser
    runs-on: ubuntu-latest
    # Scopes the secrets below to THIS job — ci.yml and deploy-dev.yml cannot read
    # them — and is where an optional required-reviewer gate lives.
    #
    # 🔴 This environment DOES NOT EXIST YET, and neither does its token. Creating it
    # means creating three things, not one — the `CLOUDFLARE_API_TOKEN` secret and
    # both variables below. See docs/deployment.md.
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          # The health check compares /health against <version>+<sha>, so the short
          # SHA has to be real.
          fetch-depth: 0

      # v6, not v4 — see the note in ci.yml. v4 declares `using: node20`, which the
      # runner force-runs on Node 24 and will eventually refuse to run at all.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same gate as CI and as `make check`. A prod deploy is not the place to
      # discover the suite is red.
      - run: pnpm check

      - run: pnpm build

      # 🔴 BEFORE anything touches the database. The artifact is the restore point.
      # A brand-new prod D1 exports an empty file, which is fine.
      - name: Back up prod D1
        run: |
          mkdir -p backups
          pnpm exec wrangler --config worker/wrangler.jsonc --env prod \
            d1 export knag --remote --output backups/knag-prod.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # 🔴 Added when deploy-dev.yml was written, because it is the one thing this
          # file was missing and could not discover: with no account id set, wrangler
          # resolves the account by calling GET /accounts — a lookup a token scoped
          # tightly to one account can fail, on the first step of a first prod run.
          # Setting it explicitly skips the lookup. A variable, not a secret: an
          # account id names a resource, it does not grant anything.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # 🔴 This one is not a warning waiting to happen — it is the restore point for a
      # prod database, and it runs on every deploy. A node20 action that stops being
      # runnable takes the backup step with it, and the failure lands *between* the
      # backup and the migration, which is the worst place in this file to lose a step.
      - uses: actions/upload-artifact@v7
        with:
          name: prod-d1-backup
          path: backups/knag-prod.sql
          retention-days: 30
          if-no-files-found: warn

      # 🔴 Migrations run BEFORE the deploy, so between this step and the next the
      # currently-deployed Worker is running against the new schema. That is why
      # migrations are additive-only and destructive changes take two releases
      # (ADR-002 §3). If this ordering ever looks wrong, the migration is wrong.
      - name: Apply D1 migrations
        if: ${{ !inputs.skip_migrations }}
        run: |
          pnpm exec wrangler --config worker/wrangler.jsonc --env prod \
            d1 migrations apply knag --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # The build id, computed once so the deploy and the verify below cannot disagree
      # about what was shipped. Matches the Makefile's BUILD_ID format exactly —
      # <version>+<shortsha> — because `make health` compares against the same string.
      - name: Compute the build id
        id: build
        run: echo "id=$(node -p "require('./package.json').version")+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Deploy the Worker
        run: |
          pnpm exec wrangler --config worker/wrangler.jsonc --env prod deploy \
            --var KNAG_VERSION:"${{ steps.build.outputs.id }}" \
            --var KNAG_DEPLOYED_AT:"$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --var KNAG_ENV:"prod"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # Close the loop: assert /health reports the exact build this run produced, in
      # the environment it was meant for. A stuck or partial rollout fails the run
      # instead of going green, and so does a KNAG_ENV declared in only one wrangler
      # block — which the build id alone cannot see, because it is identical either
      # way. No credential needed: /health is public and says nothing about the
      # document.
      # The same propagation budget as deploy-dev — see the note there. Not a
      # divergence; the two files stay mirrors.
      - name: Verify the deployed build
        run: bash scripts/health.sh knag.danjamkuhn.com "${{ steps.build.outputs.id }}" prod 90

      # 🔴 The smoke test, which health.sh is not. It asserts that authentication is
      # switched on, that the OAuth metadata is served rather than answered with the
      # PWA shell, and that unrouted paths 404 — none of which the unit suite can see,
      # because Miniflare does not serve the assets binding. Running it only against
      # dev meant prod's asset routing had never been checked at all.
      # 🔴 90s, and this is the step that needed it. The first production deploy failed
      # here seventeen seconds after "Uploaded 17 of 17 assets", with `/` at 500 and half
      # the fonts and icons still served as text/plain. Nothing was misconfigured; the
      # rollout had not finished.
      - name: Smoke-test production
        run: bash scripts/verify.sh knag.danjamkuhn.com 90
