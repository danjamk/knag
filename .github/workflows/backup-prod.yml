name: Back up production

# A prod backup that does not wait for a deploy (#233, ADR-008 §12).
#
# 🔴 The obligation changed when other people arrived. `make backup` runs when a human
# runs it, and the backup inside `deploy-prod.yml` runs when a human deploys — both of
# which are weeks apart and neither of which is a schedule. That was defensible while the
# only document at risk was the operator's own. Since ADR-008 the prod D1 holds other
# people's pages, and spec §17 said what that means before it happened: holding other
# people's data turns `make backup` from a habit into an obligation.
#
# What this is NOT: a substitute for the backup in `deploy-prod.yml`. That one is the
# restore point for the deploy about to happen and runs immediately before the migration.
# This one is the restore point for an ordinary Tuesday. Both stay.
#
# 🔴 This file is the one workflow with no counterpart in dev, and that is deliberate
# rather than drift — dev holds test content and is redeployed (and so backed up) on every
# merge to `main`. It is listed as a divergence in docs/deployment.md; an unlisted
# difference between the two pipelines is indistinguishable from a mistake.

on:
  schedule:
    # 09:00 UTC daily — early morning in America/Chicago, which is `KNAG_TZ` and so the
    # zone the document's own day boundaries use (spec §14.3). A backup taken before
    # anyone has typed is a backup of a whole finished day.
    #
    # 🔴 GitHub disables scheduled workflows in a repository with no pushes for 60 days,
    # silently, and a quiet month is exactly when nobody is watching. Nothing in this repo
    # can prevent that — it is a property of the host — so it is written down instead, in
    # docs/deployment.md, next to the one command that answers "when did this last run".
    - cron: "0 9 * * *"
  # Runs on request too: before anything destructive, and to prove the credential still
  # works without waiting a day to find out.
  workflow_dispatch:

# Never two at once. A queued backup is fine; two exports racing the same database for
# an artifact of the same name is not.
concurrency:
  group: backup-prod
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    # The prod credential lives on this environment and nowhere else — not in a clone, not
    # on the laptop (ADR-002 §1b). This job needs it for exactly one call.
    environment: production
    steps:
      - uses: actions/checkout@v5

      # 🔴 First, and before any work: alerting that is not configured is the failure
      # this job spent eight silent nights demonstrating (#260). A missing webhook is
      # caught here, on a green-looking run, rather than at the moment something has
      # actually gone wrong and the alert is the only thing that would have said so.
      - name: Assert the alert channels are configured
        run: |
          missing=""
          [ -n "${SLACK_WEBHOOK_HEARTBEAT}" ] || missing="${missing} SLACK_WEBHOOK_HEARTBEAT"
          [ -n "${SLACK_WEBHOOK_CRITICAL}" ] || missing="${missing} SLACK_WEBHOOK_CRITICAL"
          if [ -n "$missing" ]; then
            echo "::error::Missing Slack webhook secret(s):${missing} — set them on the production environment."
            exit 1
          fi
          echo "both webhooks present"
        env:
          SLACK_WEBHOOK_HEARTBEAT: ${{ secrets.SLACK_WEBHOOK_HEARTBEAT }}
          SLACK_WEBHOOK_CRITICAL: ${{ secrets.SLACK_WEBHOOK_CRITICAL }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Byte-for-byte the export `deploy-prod.yml` runs before it migrates. Same command,
      # same flags, same binding — if one of them ever needs changing, they both do.
      - name: Export prod D1
        run: |
          mkdir -p backups
          pnpm exec wrangler --config worker/wrangler.jsonc --env prod \
            d1 export knag --remote --output backups/knag-prod.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Set explicitly so wrangler skips the GET /accounts lookup, which a token
          # scoped tightly to one account can fail. A variable, not a secret: an account
          # id names a resource, it does not grant anything.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # 🔴 Fail loudly on an empty export. `d1 export` exits 0 having written a file with
      # a schema and no rows if the query returns nothing, and a green run holding an
      # empty backup is worse than a red one: it is the same signal as a good backup,
      # every day, until the day someone needs it.
      - name: Assert the export is not empty
        id: size
        run: |
          bytes=$(wc -c < backups/knag-prod.sql | tr -d ' ')
          echo "backup is ${bytes} bytes"
          echo "bytes=${bytes}" >> "$GITHUB_OUTPUT"
          if [ "$bytes" -lt 1024 ]; then
            echo "::error::The prod export is ${bytes} bytes — that is not a database."
            exit 1
          fi
          if ! grep -q "INSERT INTO" backups/knag-prod.sql; then
            echo "::error::The prod export contains no rows."
            exit 1
          fi

      # 🔴 **To R2, never to a GitHub artifact.** This dump is every page of every person
      # using this deployment, in cleartext. Artifacts on a **public repository** are
      # reachable by anyone with read access to the repo — which for a public repo is
      # everyone — and the artifact list is readable with no authentication at all. The
      # first version of this file uploaded one nightly; 27 of them were sitting in the
      # open before anyone asked where the backups went.
      #
      # R2 is in the prod account, private by default, and holds the same data D1 already
      # holds — so it adds no trust boundary that was not already crossed. It also keeps
      # the dangerous credential where it already lives: the token stays in Actions, and a
      # laptop that wants a copy uses a **read-only** R2 token (`make backup-pull`)
      # rather than the D1:Edit one that `d1 export` requires.
      #
      # Dated key, so the bucket reads as a history rather than one object overwritten.
      - name: Name the object by date
        id: stamp
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Put it in R2
        run: |
          pnpm exec wrangler r2 object put \
            "knag-backups/prod/knag-prod-${{ steps.stamp.outputs.day }}.sql" \
            --file backups/knag-prod.sql --remote --content-type "application/sql"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # 🔴 Read the object back rather than trusting the put's exit code. `wrangler r2
      # object put` reporting "Upload complete" is a claim about a request, and the whole
      # lesson of this job is that a green step is not evidence the thing exists. This
      # asks the bucket.
      - name: Confirm the object is in the bucket
        run: |
          pnpm exec wrangler r2 object get \
            "knag-backups/prod/knag-prod-${{ steps.stamp.outputs.day }}.sql" \
            --remote --file /tmp/readback.sql
          got=$(wc -c < /tmp/readback.sql | tr -d ' ')
          echo "read back ${got} bytes"
          if [ "$got" != "${{ steps.size.outputs.bytes }}" ]; then
            echo "::error::Read back ${got} bytes but wrote ${{ steps.size.outputs.bytes }}."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # The heartbeat. It says what was written and how big it was, not merely that
      # something happened — "the backup ran" and "the backup holds a database" are
      # different claims, and only the second one is worth waking up to a message about.
      - name: Heartbeat
        run: |
          bash scripts/slack-notify.sh heartbeat \
            "✅ knag prod backup — prod/knag-prod-${{ steps.stamp.outputs.day }}.sql, ${{ steps.size.outputs.bytes }} bytes, verified in the bucket. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        env:
          SLACK_WEBHOOK_HEARTBEAT: ${{ secrets.SLACK_WEBHOOK_HEARTBEAT }}

      # 🔴 `if: failure()` and last, so it fires for **any** step above — the export, the
      # emptiness assertion, the upload, the read-back, or the missing-webhook guard. The
      # eight failures nobody saw died at the upload; the next one will die somewhere else,
      # and an alert wired to one step is an alert for last time's outage.
      - name: Alert on failure
        if: failure()
        run: |
          bash scripts/slack-notify.sh critical \
            "🔴 knag PROD BACKUP FAILED — the restore point for production was not written. Job: ${GITHUB_WORKFLOW}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        env:
          SLACK_WEBHOOK_CRITICAL: ${{ secrets.SLACK_WEBHOOK_CRITICAL }}
