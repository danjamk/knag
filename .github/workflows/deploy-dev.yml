name: Deploy to dev

# Dev deploys itself. Every merge to `main` runs the real upgrade sequence against the
# dev account, so "is dev running main?" is answered by the run list instead of by
# checking.
#
# 🔴 The reason this exists is NOT the saved `make deploy`. It is that
# `deploy-prod.yml` has never executed — so without this file, the first time that
# sequence runs anywhere it runs against production, against the prod D1, with every
# step running for the first time. This is the rehearsal. Keep the two files in step:
# a change to one that is not a deliberate divergence belongs in both.
#
# The sequence is backup → migrate → deploy → health → verify, and the ordering is
# load-bearing. Migrations run BEFORE the deploy, so between those two steps the live
# Worker runs against the new schema — which is why migrations are additive-only
# (ADR-002 §3). A workflow that only deployed would ship a Worker against an
# un-migrated D1 the first time a PR added a migration, failing at runtime rather than
# at deploy time.

on:
  push:
    branches: [main]
  # The recovery hatch, same reasoning as ci.yml: GitHub webhooks have been throttled
  # hard enough that a merge to main landed with no run created and no way to ask for
  # one. No inputs — this deploys whatever `main` is, which is the only thing it is
  # for.
  workflow_dispatch:

# 🔴 Two quick merges must not overlap their migrations, and the one in flight must not
# be cancelled — a half-applied migration is worse than a queued deploy. Same setting
# as prod, for the same reason.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 🔴 This is what keeps ADR-002's split intact now that a second Cloudflare
    # credential exists in GitHub. Scoping the token to an environment means the dev
    # token is readable only by this job: `deploy-prod.yml` declares `production` and
    # cannot see it, `ci.yml` declares nothing and can see neither.
    #
    # Deliberately NO required reviewer, unlike production. Dev is not a decision.
    environment: development
    steps:
      - uses: actions/checkout@v5
        with:
          # The health check compares /health against <version>+<sha>, so the short
          # SHA has to be real.
          fetch-depth: 0

      # v6, not v4 — see the note in ci.yml. v4 declares `using: node20`, which the
      # runner force-runs on Node 24 and will eventually refuse to run at all.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Duplicated with ci.yml, which also runs on push to main. Kept anyway: prod
      # runs it, and mirroring prod is the point of this file. Gating on ci.yml with
      # `workflow_run` instead would add a failure class production does not have.
      - run: pnpm check

      - run: pnpm build

      # 🔴 BEFORE anything touches the database. Dev holds test content only, so the
      # artifact matters less here than in prod — but the step running every time is
      # exactly what is being rehearsed, and a backup step that is only exercised in
      # production is not a backup step.
      - name: Back up dev D1
        run: |
          mkdir -p backups
          pnpm exec wrangler --config worker/wrangler.jsonc \
            d1 export knag-dev --remote --output backups/knag-dev.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # 7 days, not prod's 30. This is test content, and a dev restore point older
      # than a week has never been the thing anyone wanted.
      - uses: actions/upload-artifact@v7
        with:
          name: dev-d1-backup
          path: backups/knag-dev.sql
          retention-days: 7
          if-no-files-found: warn

      # 🔴 Migrations run BEFORE the deploy, so between this step and the next the
      # currently-deployed Worker is running against the new schema. That is why
      # migrations are additive-only and destructive changes take two releases
      # (ADR-002 §3). If this ordering ever looks wrong, the migration is wrong.
      #
      # 🔴 Deliberate divergence from prod: there is no `skip_migrations` input. Prod
      # keeps that escape hatch for a deploy you need out under a known-clean schema.
      # Dev is where the migration path gets exercised, and an input that lets you
      # skip it defeats the rehearsal.
      - name: Apply D1 migrations
        run: |
          pnpm exec wrangler --config worker/wrangler.jsonc \
            d1 migrations apply knag-dev --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # The build id, computed once so the deploy and the checks below cannot disagree
      # about what was shipped. Matches the Makefile's BUILD_ID format exactly —
      # <version>+<shortsha> — because health.sh compares against the same string.
      - name: Compute the build id
        id: build
        run: echo "id=$(node -p "require('./package.json').version")+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # No `--env` flag. The top level of wrangler.jsonc IS dev — the same reason
      # `make deploy` passes none.
      - name: Deploy the Worker
        run: |
          pnpm exec wrangler --config worker/wrangler.jsonc deploy \
            --var KNAG_VERSION:"${{ steps.build.outputs.id }}" \
            --var KNAG_DEPLOYED_AT:"$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --var KNAG_ENV:"dev"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # Close the loop: assert /health reports the exact build this run produced, in
      # the environment it was meant for. Catches a stuck rollout, and catches a
      # KNAG_ENV declared in only one wrangler block — which the build id alone cannot
      # see, because it is identical either way. No credential needed: /health is
      # public and says nothing about the document.
      #
      # 🔴 The host comes from an environment VARIABLE, not from this file. Prod hard
      # codes `knag.danjamkuhn.com`; dev cannot, because the dev *.workers.dev
      # hostname was deliberately taken out of the tracked files when the repo went
      # public — it is a live login form that the WAF rate-limit rule cannot cover
      # (spec §4.2). Same reason `.env.example` ships DEV_HOST as a placeholder.
      - name: Verify the deployed build
        run: bash scripts/health.sh "${{ vars.DEV_HOST }}" "${{ steps.build.outputs.id }}" dev

      # The smoke test, which health.sh is not. It asserts authentication is switched
      # on, that OAuth metadata is served rather than answered with the PWA shell, that
      # fonts and icons arrive with the right content type, and that unrouted paths
      # 404 — none of which the unit suite can see, because Miniflare does not serve
      # the assets binding.
      - name: Smoke-test dev
        run: bash scripts/verify.sh "${{ vars.DEV_HOST }}"
