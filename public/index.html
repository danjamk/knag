<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="knag" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>knag</title>
    <link rel="manifest" href="/manifest.json" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #111;
        --fg: #e8e8e8;
        --dim: #888;
        --line: #333;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      /* Full-bleed editor. Safe-area insets matter because a home-screen PWA runs
         fullscreen — without them the notch eats the first line. */
      [data-editor] {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
                 env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      /* 🔴 Nothing in this rule may introduce text-transform, white-space collapsing,
         or anything else that makes what is displayed differ from what is stored.
         `wrap="off"` lives on the element rather than here, because it changes what
         the textarea *does* to long lines, not how they look. */
      [data-body] {
        flex: 1;
        width: 100%;
        margin: 0;
        padding: 1rem;
        border: 0;
        resize: none;
        background: transparent;
        color: inherit;
        font: inherit;
        tab-size: 4;
        /* 16px minimum, or iOS Safari zooms the viewport on focus and never zooms back. */
        font-size: 16px;
      }
      [data-body]:focus { outline: none; }

      /* List view. One row per block; blanks are thin spacers rather than absent,
         so a row's position keeps matching its block index. */
      [data-rows] {
        flex: 1;
        overflow-y: auto;
        list-style: none;
        margin: 0;
        padding: 0.5rem 0;
      }
      /* 🔴 Four targets in one row at 380px (spec §7): grip, checkbox, text, copy.
         Grip and copy are fixed at 28px and the text flexes between them, so the
         layout degrades by truncating prose rather than by shrinking a tap target
         below what a thumb can hit. */
      [data-rows] li {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.3rem 0.5rem;
        min-height: 2rem;
      }
      .grip, .copy {
        flex: none;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 0;
        background: transparent;
        color: #4a4a4a;
        font: inherit;
        font-size: 0.9rem;
        border-radius: 4px;
      }
      .copy { cursor: pointer; }
      .copy:active { background: #2a2a2a; }
      /* The row being dragged. Kept subtle — the movement is the feedback. */
      li.dragging { opacity: 0.4; background: #1d1d1d; }
      /* Without this, a drag starting on the grip selects text across rows on
         desktop and fights the gesture on touch. */
      .grip { touch-action: none; user-select: none; }
      /* Always visible. There is no hover on touch, so revealing controls on hover
         would make them unreachable on the device this is built for. */
      .grip { cursor: grab; }

      li.blank { min-height: 1.25rem; padding: 0 0.5rem; }
      li.fence { flex-wrap: wrap; align-items: flex-start; }
      li.fence .grip { order: 1; }
      li.fence .copy { order: 1; margin-left: auto; }
      /* A fence is one block and inherently multi-line, so it gets the element that
         is natively multi-line. This is what removes the last thing raw view was
         required for (ADR-003 §2). */
      textarea.fence {
        flex: 1 1 100%;
        order: 2;
        margin: 0;
        padding: 0.6rem 0.8rem;
        border: 0;
        border-radius: 6px;
        background: #191919;
        color: inherit;
        font: inherit;
        font-size: 16px;
        resize: vertical;
        white-space: pre;
        overflow-x: auto;
      }
      textarea.fence:focus { outline: 1px solid #333; }

      .open {
        flex: none;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #7aa2d2;
        text-decoration: none;
        border-radius: 4px;
      }
      li.checkbox input { flex: none; width: 1.1rem; height: 1.1rem; accent-color: #6b8f6b; }
      /* Every row's text is a live input now — no tap-to-activate, no span/input
         swap. Truncation happens naturally: an input scrolls its own content, so a
         long line stays one row and the caret stays visible while typing. */
      input.text {
        flex: 1;
        min-width: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        /* 16px or iOS zooms the viewport on focus and never zooms back. */
        font-size: 16px;
      }
      input.text:focus { outline: none; }
      li.checked input.text { text-decoration: line-through; color: #666; }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.5rem 1rem;
        border-top: 1px solid var(--line);
        color: var(--dim);
        font-size: 0.75rem;
      }
      footer button {
        padding: 0.2rem 0.6rem;
        font-size: 0.75rem;
        border-radius: 4px;
      }
      /* Pushed left of the view toggle so the destructive control is never the one
         under your thumb by accident. */
      [data-clear] { margin-left: auto; }

      [data-login] {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        max-width: 28rem;
        margin: 0 auto;
        padding: max(3rem, env(safe-area-inset-top)) 1rem 1rem;
      }
      [data-login] h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.5rem; }

      input, button {
        font: inherit;
        font-size: 16px;
        padding: 0.75rem;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: #1a1a1a;
        color: inherit;
      }
      button { background: #2a2a2a; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }

      [hidden] { display: none !important; }
      [data-error] { color: #e06c6c; min-height: 1.5rem; }
    </style>
  </head>
  <body>
    <form data-login hidden>
      <h1>knag</h1>
      <!-- autocomplete="current-password" so the browser and the iOS Keychain offer
           to save it. Retyping a long random passphrase on a phone is the friction
           that decides whether this app gets opened. -->
      <input
        type="password"
        name="passphrase"
        placeholder="passphrase"
        autocomplete="current-password"
        required
      />
      <input
        type="text"
        name="device_label"
        placeholder="device label (optional)"
        autocomplete="off"
      />
      <button type="submit">Log in</button>
      <span data-error role="alert"></span>
    </form>

    <div data-editor hidden>
      <!-- 🔴 Every attribute on this element is load-bearing for byte preservation.
           Hard wrapping can insert newlines into the value; autocorrect and
           autocapitalize rewrite words on iOS. A textarea is the one component in
           this stack that mangles input silently if you let it, and none of these
           going missing breaks a build or changes how anything looks. Pinned by
           worker/test/shell.test.ts. See spec §8. -->
      <textarea
        data-body
        wrap="off"
        spellcheck="false"
        autocapitalize="off"
        autocorrect="off"
        autocomplete="off"
        aria-label="document"
      ></textarea>
      <!-- The list view. One <li> per block, always — see client/src/view.ts for why
           filtering blanks out would make a row's position stop meaning its block
           index. -->
      <ul data-rows hidden></ul>

      <footer>
        <span data-save-status>—</span>
        <button type="button" data-clear hidden>clear done</button>
        <button type="button" data-toggle-view>raw</button>
        <span data-build>—</span>
      </footer>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
